name: Build & Deploy to GSG (O'Neal Server)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy-gsg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application for GSG
        run: npm run build
        env:
          NODE_ENV: production
          # GSG/O'Neal Server uses local oneal-api-v2
          VITE_ONEAL_API_BASE: ${{ secrets.GSG_VITE_ONEAL_API_BASE }}
          VITE_ONEAL_API_KEY: ${{ secrets.GSG_VITE_ONEAL_API_KEY }}
          VITE_STORAGE_API_URL: ${{ secrets.GSG_VITE_STORAGE_API_URL }}
          VITE_STORAGE_PROXY_URL: ${{ secrets.GSG_VITE_STORAGE_PROXY_URL }}
          VITE_STORAGE_API_KEY: ${{ secrets.GSG_VITE_STORAGE_API_KEY }}
          VITE_ARTRACK_API_BASE: ${{ secrets.VITE_ARTRACK_API_BASE }}
          # Internal demo surface only; the BFF REALTIME_ENABLED switch remains
          # the authoritative fail-closed production kill switch.
          VITE_PRODUCTFINDER_REALTIME_ENABLED: 'true'

      - name: Deploy to GSG server via arkturian jump host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: arkturian.com
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            # Deploy to GSG server using the configured SSH key
            ssh -i /root/.ssh/oneal_aiserver -o StrictHostKeyChecking=no gsgbot@aiserver.oneal.eu '
              set -e
              CI_DIR=/var/www/productfinder/ci
              SITE_DIR=/var/www/productfinder/site
              REPOSITORY_URL=https://github.com/apopovic77/productfinder.git

              # This clone belongs exclusively to CI. Never mutate the shared
              # operator checkout in /var/www/productfinder/repo.
              if [ ! -d "$CI_DIR/.git" ]; then
                mkdir -p "$(dirname "$CI_DIR")"
                git clone --branch main --single-branch "$REPOSITORY_URL" "$CI_DIR"
              else
                git -C "$CI_DIR" remote set-url origin "$REPOSITORY_URL"
                git -C "$CI_DIR" fetch origin main
                git -C "$CI_DIR" reset --hard origin/main
              fi

              cd "$CI_DIR"
              git config submodule.libs/realtime-agent-web-core.url \
                https://github.com/apopovic77/realtime-agent-web-core.git
              git submodule sync --recursive
              git submodule update --init --recursive

              # Create .env with GSG config (using local storage API)
              cat > .env << EOF
            VITE_BASE_PATH=/
            VITE_ONEAL_API_BASE=https://gsgbot.arkturian.com/oneal-api/v1
            VITE_ONEAL_API_KEY=oneal_demo_token
            VITE_STORAGE_API_URL=https://gsgbot.arkturian.com/storage-api
            VITE_STORAGE_API_KEY=gsg_storage_key_2024
            VITE_PRODUCTFINDER_REALTIME_ENABLED=true
            EOF

              npm install
              VITE_BASE_PATH=/ npm run build
              mkdir -p "$SITE_DIR"
              rsync -av --delete dist/ "$SITE_DIR/"
              echo "Deployment to aiserver completed!"
            '

            # Sync dist from aiserver to arkturian (nginx serves from /var/www/productfinder/dist/)
            rsync -avz --delete -e "ssh -i /root/.ssh/oneal_aiserver -o StrictHostKeyChecking=no" \
              gsgbot@aiserver.oneal.eu:/var/www/productfinder/site/ /var/www/productfinder/dist/
            echo "Synced dist to arkturian nginx root"

      - name: Notify on success
        if: success()
        run: echo "✅ GSG Deployment successful for commit ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ GSG Deployment failed for commit ${{ github.sha }}"
